services:
- type: web
  name: k-claim-api-staging
  env: python
  plan: standard
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn my_fastapi_app.app:app --host 0.0.0.0 --port $PORT
  healthCheckPath: /health
  autoDeploy: true
  envVars:
    - key: ENABLE_DOCS
      value: "1"
    - key: OVERLAY_DEFAULT
      value: "0"

    # --- Model ---
    - key: MODEL_PATH
      value: my_fastapi_app/trained.pt
    - key: MODEL_VERSION
      value: trained.pt@v1

    # --- Confidence gates ---
    - key: CONF_MIN_GATE
      value: "0.10"      # was 0.25
    - key: CONF_DENT
      value: "0.70"
    - key: CONF_SCRATCH
      value: "0.35"
    - key: CONF_GENERIC
      value: "0.25"
    - key: CONF_WINDSHIELD
      value: "0.60"      # was 0.80
    - key: CONF_FLAT_TIRE
      value: "0.80"

    # --- Windshield / border shape guards ---
    - key: BORDER_THIN_FRAC
      value: "0.12"
    - key: BORDER_PIX
      value: "3"
    - key: MIN_WSHIELD_HF
      value: "0.12"      # was 0.18

    # --- Inference options ---
    - key: IMG_SIZE
      value: "1280"      # was 960
    - key: AGNOSTIC_NMS
      value: "0"

    # --- Quality hints (non-blocking) ---
    - key: MIN_SHORT_SIDE
      value: "640"
    - key: MIN_BLUR_VAR
      value: "60"
    - key: BRIGHT_MIN
      value: "60"
    - key: BRIGHT_MAX
      value: "200"
